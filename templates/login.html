<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - O brownie Mania</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="login-page">

<div class="login-card">

    <div class="text-center mb-4">

        <div class="logo-cookie">🍪</div>

        <h1>O brownie Mania</h1>

        <p>Entre na sua conta</p>

    </div>


    {% with mensagens = get_flashed_messages(with_categories=true) %}

        {% if mensagens %}

            {% for categoria, mensagem in mensagens %}

                <div class="alert alert-{{ categoria }}">
                    {{ mensagem }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                E-mail
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Senha
            </label>

            <input type="password"
                   name="senha"
                   class="form-control"
                   required>

        </div>


        <button type="submit"
                class="btn btn-brownie w-100">

            Entrar

        </button>

    </form>


    <div class="text-center mt-3">

        <a href="{{ url_for('cadastrar') }}"
           class="link-brownie">

            Ainda não possui cadastro? Cadastre-se

        </a>

    </div>

</div>

</body>
</html>
