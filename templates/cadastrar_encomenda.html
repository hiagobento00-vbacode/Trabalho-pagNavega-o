{% extends "base.html" %}

{% block title %}Cadastrar Encomenda - O brownie Mania{% endblock %}

{% block content %}

<div class="form-card">

    <h2>Cadastro de Encomenda</h2>

    <p class="subtitle">
        Registre uma nova encomenda.
    </p>


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Nome do cliente
            </label>

            <select name="nome"
                    class="form-select"
                    required>

                <option value="">
                    Selecione o cliente
                </option>

                {% for usuario in usuarios %}

                    <option value="{{ usuario['nome'] }}">
                        {{ usuario['nome'] }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Produto
            </label>

            <input type="text"
                   name="produto"
                   class="form-control"
                   required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Data de entrega
            </label>

            <input type="date"
                   name="data_entrega"
                   class="form-control"
                   required>

        </div>


        <button type="submit"
                class="btn btn-brownie">

            Cadastrar encomenda

        </button>


        <a href="{{ url_for('listar_encomenda') }}"
           class="btn btn-outline-secondary">

            Ver encomendas

        </a>

    </form>

</div>

{% endblock %}
