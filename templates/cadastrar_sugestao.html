{% extends "base.html" %}

{% block title %}Cadastrar Sugestão - O brownie Mania{% endblock %}

{% block content %}

<div class="form-card">

    <h2>Cadastro de Sugestão</h2>

    <p class="subtitle">
        Envie uma sugestão para a nossa loja.
    </p>


    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Nome do cliente
            </label>

            <select name="nome"
                    class="form-select"
                    required>

                <option value="">
                    Selecione o cliente
                </option>

                {% for usuario in usuarios %}

                    <option value="{{ usuario['nome'] }}">
                        {{ usuario['nome'] }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Sugestão
            </label>

            <textarea name="sugestao"
                      class="form-control"
                      rows="5"
                      required></textarea>

        </div>


        <button type="submit"
                class="btn btn-brownie">

            Cadastrar sugestão

        </button>


        <a href="{{ url_for('listar_sugestao') }}"
           class="btn btn-outline-secondary">

            Ver sugestões

        </a>

    </form>

</div>

{% endblock %}
